<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CyberForges - Admin Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans antialiased min-h-screen flex flex-col justify-between">

    <!-- Header -->
    <header class="border-b border-slate-800 py-4 px-6 flex justify-between items-center bg-slate-900/50 backdrop-blur">
        <div class="flex items-center space-x-2">
            <span class="text-xl font-bold tracking-wider text-cyan-400">CYBERFORGES</span>
            <span class="text-xs px-2 py-0.5 rounded bg-rose-950 text-rose-300 border border-rose-800">Admin Portal</span>
        </div>
        <div id="logoutSection" class="hidden">
            <button onclick="handleLogout()" class="text-xs text-rose-400 hover:text-rose-300 border border-rose-900/50 px-3 py-1.5 rounded-lg bg-rose-950/30 transition cursor-pointer">
                Logout
            </button>
        </div>
    </header>

    <!-- Main Container -->
    <main class="flex-grow flex items-center justify-center px-4 py-10">
        
        <!-- Login Box -->
        <div id="loginBox" class="max-w-md w-full bg-slate-900 border border-slate-800 rounded-2xl p-8 shadow-2xl">
            <h1 class="text-xl font-bold text-center mb-1">Admin Login</h1>
            <p class="text-slate-400 text-center text-xs mb-6">Enter password to access security leads.</p>
            
            <form id="loginForm" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">Password</label>
                    <input type="password" id="adminPassword" placeholder="Enter admin password" required
                        class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-slate-100 text-sm focus:outline-none focus:border-cyan-500 transition">
                </div>
                <button type="submit" 
                    class="w-full bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-bold py-3 px-4 rounded-xl text-sm transition shadow-lg shadow-cyan-500/20 cursor-pointer">
                    Login to Dashboard
                </button>
                <p id="loginError" class="hidden text-xs text-rose-400 text-center font-semibold">Incorrect password! Try 'admin123'.</p>
            </form>
        </div>

        <!-- Dashboard Content -->
        <div id="dashboardBox" class="hidden max-w-5xl w-full mx-auto">
            <div class="flex justify-between items-center mb-6">
                <h1 class="text-2xl font-bold">Captured Security Leads</h1>
                <button onclick="fetchLeads()" class="bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-semibold px-4 py-2 rounded-lg text-xs transition cursor-pointer">
                    Refresh Leads
                </button>
            </div>

            <div class="bg-slate-900 border border-slate-800 rounded-2xl overflow-hidden shadow-2xl">
                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="border-b border-slate-800 bg-slate-950/50 text-xs text-slate-400 uppercase tracking-wider">
                                <th class="p-4">Name</th>
                                <th class="p-4">Email</th>
                                <th class="p-4">Target Domain</th>
                                <th class="p-4">Date / Time</th>
                            </tr>
                        </thead>
                        <tbody id="leadsTableBody" class="text-sm divide-y divide-slate-800">
                            <tr>
                                <td colspan="4" class="p-6 text-center text-slate-500">Loading leads...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

    </main>

    <!-- Footer -->
    <footer class="border-t border-slate-800 py-4 text-center text-xs text-slate-500">
        &copy; 2026 CyberForges. Internal Admin Panel.
    </footer>

    <script>
        // NOTE: Yahan bhi backend ka URL change karna hoga jab live karein
        const API_URL = 'https://cyberforges.onrender.com';
        const ADMIN_PASS = "admin123";

        if (sessionStorage.getItem('isLoggedIn') === 'true') {
            showDashboard();
        }

        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const pass = document.getElementById('adminPassword').value;
            const errorText = document.getElementById('loginError');

            if (pass === ADMIN_PASS) {
                sessionStorage.setItem('isLoggedIn', 'true');
                showDashboard();
            } else {
                errorText.classList.remove('hidden');
            }
        });

        function showDashboard() {
            document.getElementById('loginBox').classList.add('hidden');
            document.getElementById('dashboardBox').classList.remove('hidden');
            document.getElementById('logoutSection').classList.remove('hidden');
            fetchLeads();
        }

        function handleLogout() {
            sessionStorage.removeItem('isLoggedIn');
            document.getElementById('dashboardBox').classList.add('hidden');
            document.getElementById('logoutSection').classList.add('hidden');
            document.getElementById('loginBox').classList.remove('hidden');
            document.getElementById('adminPassword').value = '';
        }

        async function fetchLeads() {
            const tableBody = document.getElementById('leadsTableBody');
            tableBody.innerHTML = `<tr><td colspan="4" class="p-6 text-center text-slate-500">Fetching leads...</td></tr>`;

            try {
                const response = await fetch(`${API_URL}/api/leads`);
                const leads = await response.json();

                if (leads.length === 0) {
                    tableBody.innerHTML = `<tr><td colspan="4" class="p-6 text-center text-slate-500">No leads captured yet.</td></tr>`;
                    return;
                }

                tableBody.innerHTML = leads.map(lead => `
                    <tr class="hover:bg-slate-800/40 transition">
                        <td class="p-4 font-semibold text-cyan-300">${lead.name}</td>
                        <td class="p-4 text-slate-300">${lead.email}</td>
                        <td class="p-4 text-slate-300">${lead.domain}</td>
                        <td class="p-4 text-xs text-slate-500">${new Date(lead.date).toLocaleString()}</td>
                    </tr>
                `).join('');
            } catch (err) {
                tableBody.innerHTML = `<tr><td colspan="4" class="p-6 text-center text-rose-400">Could not connect to backend server.</td></tr>`;
            }
        }
    </script>
</body>
</html>
